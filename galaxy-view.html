<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Galaxy view · 市场研发中心</title>
<style>
  :root {
    --bg: #0d0d10;
    --panel: #16161a;
    --border: #2a2a30;
    --text: #e6e6ec;
    --text-dim: #8a8a96;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  #canvas { display: block; width: 100%; height: 100%; }

  #topbar {
    position: fixed; top: 16px; left: 50%;
    transform: translateX(-50%);
    background: rgba(22,22,26,0.85);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px 6px 16px;
    display: flex; align-items: center; gap: 10px;
    font-size: 13px;
    z-index: 10;
    user-select: none;
  }
  #topbar .count { color: var(--text); font-weight: 600; }
  #topbar .sep { width: 1px; height: 16px; background: var(--border); }
  #topbar button {
    background: transparent; border: 0; color: var(--text-dim);
    cursor: pointer; font-size: 14px; padding: 4px 8px;
    border-radius: 6px; transition: all 0.15s;
  }
  #topbar button:hover { background: rgba(255,255,255,0.06); color: var(--text); }

  /* 左下角图例 */
  #legend {
    position: fixed; bottom: 18px; left: 18px;
    background: rgba(22,22,26,0.85);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    z-index: 10;
    user-select: none;
  }
  #legend .lh { font-weight: 600; margin-bottom: 6px; color: var(--text); }
  #legend .li {
    display: flex; align-items: center; gap: 8px;
    color: var(--text-dim); margin: 3px 0;
  }
  #legend .dot {
    width: 10px; height: 10px; border-radius: 50%;
    box-shadow: 0 0 8px currentColor;
  }
  #legend .num { color: var(--text); margin-left: auto; font-variant-numeric: tabular-nums; }

  #hint {
    position: fixed; bottom: 18px; left: 50%;
    transform: translateX(-50%);
    font-size: 12px; color: var(--text-dim);
    background: rgba(22,22,26,0.6);
    padding: 6px 14px; border-radius: 999px;
    z-index: 10; user-select: none; opacity: 0.85;
  }

  #tooltip {
    position: fixed; pointer-events: none;
    background: rgba(22,22,26,0.96);
    border: 1px solid var(--border);
    color: var(--text); font-size: 12px;
    padding: 6px 10px; border-radius: 6px;
    max-width: 360px; z-index: 20;
    display: none; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  #tooltip .t-name { color: var(--text); font-weight: 500; word-break: break-all; }
  #tooltip .t-meta { color: var(--text-dim); font-size: 11px; margin-top: 3px; }
  #tooltip .t-path { color: var(--text-dim); font-size: 10px; margin-top: 3px;
                     font-family: ui-monospace, monospace; word-break: break-all; }

  #focus-label {
    position: fixed; pointer-events: none;
    background: rgba(22,22,26,0.96);
    border: 1px solid var(--border);
    color: var(--text); font-size: 16px;
    padding: 12px 18px; border-radius: 10px;
    z-index: 15; display: none;
    box-shadow: 0 6px 28px rgba(0,0,0,0.7);
    max-width: 460px;
  }
  #focus-label .fl-name { font-weight: 700; font-size: 16px; word-break: break-all; letter-spacing: 0.2px; }
  #focus-label .fl-meta { color: var(--text-dim); font-size: 13px; margin-top: 6px; font-weight: 400; }

  #loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); font-size: 13px;
    z-index: 30;
  }
  #loading.hide { display: none; }
</style>
</head>
<body>
<div id="loading">加载知识图谱中…</div>
<div id="stage">
  <canvas id="canvas"></canvas>
</div>

<div id="topbar">
  <span class="count" id="noteCount">— 笔记</span>
  <span class="sep"></span>
  <button id="btnReset" title="重置视图">⟲</button>
  <button id="btnHelp" title="操作提示">?</button>
  <button id="btnZoomIn" title="放大">+</button>
  <button id="btnZoomOut" title="缩小">−</button>
</div>

<div id="legend">
  <div class="lh">目录图例</div>
  <div id="legendItems"></div>
</div>

<div id="hint">🖱 拖拽节点移动 · 点击节点高亮关联 · 滚轮缩放 · 拖拽空白平移</div>

<div id="tooltip">
  <div class="t-name"></div>
  <div class="t-meta"></div>
  <div class="t-path"></div>
</div>

<div id="focus-label">
  <div class="fl-name"></div>
  <div class="fl-meta"></div>
</div>

<script src="galaxy-data.js"></script>
<script>
/* =====================================================================
 * Galaxy view · 真实 vault 数据驱动的知识星图
 * 数据内联（来自 F:\市场研发中心，817 节点 / 1158 wikilink 边）
 * ===================================================================== */
// 全局错误捕获 → 显示在 loading 区
window.addEventListener('error', (e) => {
  const el = document.getElementById('loading');
  if (el) {
    el.style.display = 'flex';
    el.style.color = '#ff6b6b';
    el.style.fontSize = '11px';
    el.style.maxWidth = '80%';
    el.style.textAlign = 'left';
    el.style.whiteSpace = 'pre-wrap';
    el.textContent = '❌ ' + (e.message || '未知错误') + '\n   位置: ' + (e.filename||'') + ':' + (e.lineno||'') + ':' + (e.colno||'');
  }
});
window.addEventListener('unhandledrejection', (e) => {
  const el = document.getElementById('loading');
  if (el) {
    el.style.display = 'flex';
    el.style.color = '#ff6b6b';
    el.style.fontSize = '11px';
    el.style.maxWidth = '80%';
    el.style.textAlign = 'left';
    el.style.whiteSpace = 'pre-wrap';
    el.textContent = '❌ Promise 异常: ' + (e.reason && e.reason.message || e.reason || '?') +
                     '\n   ' + (e.reason && e.reason.stack || '').slice(0, 600);
  }
});
(async function main() {
  try {
  // 数据内联（避免 file:// 协议下 fetch 失败）
  if (!window.__GALAXY_DATA__) {
    document.getElementById('loading').textContent = '❌ 数据未注入：window.__GALAXY_DATA__ 为空';
    return;
  }
  const RAW = window.__GALAXY_DATA__;

  const COLORS = RAW.colorMap;
  const NODES_RAW = RAW.nodes;
  const LINKS_RAW = RAW.links;
  const stats = RAW.stats;

  // ---------- 业务白名单：只渲染这 5 个目录的节点 ----------
  // 剔除：人物 / ROOT(README/canvas) / _模板 / Excalidraw
  // 必须在任何渲染/统计前声明，因为顶栏和图例都依赖它
  const VISIBLE_DIRS = new Set([
    "01 产研+实验室",
    "02 品牌部",
    "03 市场客源组",
    "04 市场内容组",
    "00 中心",
  ]);
  const NODES_VIS_RAW = NODES_RAW.filter(n => VISIBLE_DIRS.has(n.dir));
  const LINKS_VIS_RAW = LINKS_RAW.filter(l => {
    // 这里只能先按 name 粗过滤；后续 ID → node 映射建好后再生成 EDGES_VIS
    // 但 NODES_RAW 里的 name 是文件名，links 里是 basename，
    // 简化处理：先不在这步过滤边，留到边构建时一起做
    return true;
  });
  console.log(`白名单内节点（待映射）: ${NODES_VIS_RAW.length}`);

  // 隐藏 loading
  document.getElementById('loading').classList.add('hide');

  // 顶栏
  document.getElementById('noteCount').textContent = `${NODES_VIS_RAW.length} 笔记`;

  // 图例（只显示白名单内 5 个目录）
  const legendItems = document.getElementById('legendItems');
  const dirLabels = {
    "01 产研+实验室": "产研+实验室",
    "02 品牌部": "品牌部",
    "03 市场客源组": "市场客源组",
    "04 市场内容组": "市场内容组",
    "00 中心": "中心",
  };
  // 按 NODES_VIS_RAW 统计
  const dirCount = {};
  for (const n of NODES_VIS_RAW) dirCount[n.dir] = (dirCount[n.dir] || 0) + 1;
  Object.keys(dirLabels).forEach(dir => {
    const n = dirCount[dir] || 0;
    if (n === 0) return;
    const c = COLORS[RAW.dirColor[dir]] || COLORS.pink;
    const item = document.createElement('div');
    item.className = 'li';
    item.innerHTML = `<span class="dot" style="background:${c.core};color:${c.glow}"></span>` +
                     `<span>${dirLabels[dir]}</span><span class="num">${n}</span>`;
    legendItems.appendChild(item);
  });

  /* ---------- 节点 ---------- */
  // 用 id 索引（只构建白名单内的节点）
  const idIndex = new Map();
  const NODES = NODES_VIS_RAW.map((n, i) => {
    // 节点尺寸：按 degree 三档
    let size;
    if (n.kind === 'hub')        size = 8.0 + Math.min(4, n.degree / 25);
    else if (n.kind === 'mid')   size = 3.5 + Math.random() * 1.5;
    else                          size = 2.0 + Math.random() * 1.2;

    // 初始位置：按颜色分 3 个聚类 + 一定随机
    const color = n.color;
    let cx = 0, cy = 0, cr = 0;
    if (color === 'pink')       { cx = 0;             cy = 0;            cr = 220; }
    else if (color === 'green') { cx = -300;           cy = 180;          cr = 220; }
    else if (color === 'cyan')  { cx = 300;            cy = -150;         cr = 180; }
    else if (color === 'amber') { cx = 0;              cy = -250;         cr = 140; }
    else                         { cx = 0;              cy = 250;          cr = 100; }
    const a = Math.random() * Math.PI * 2;
    const r = cr * (0.3 + Math.random() * 0.7);

    const node = {
      id: n.id, name: n.name, path: n.path, dir: n.dir, color,
      size, kind: n.kind, degree: n.degree,
      x: cx + Math.cos(a) * r,
      y: cy + Math.sin(a) * r,
      vx: 0, vy: 0,
      pulse: Math.random() * Math.PI * 2,
    };
    idIndex.set(n.id, node);
    return node;
  });

  /* ---------- 边 ---------- */
  // 用真实 wikilink 关系（去重/过滤无效）
  const linkSet = new Set();
  const EDGES = [];
  for (const l of LINKS_RAW) {
    const a = idIndex.get(l.source), b = idIndex.get(l.target);
    if (!a || !b) continue;
    const key = a.id < b.id ? `${a.id}|${b.id}` : `${b.id}|${a.id}`;
    if (linkSet.has(key)) continue;
    linkSet.add(key);
    EDGES.push({ a, b });
  }

  console.log(`边去重后: ${EDGES.length}`);
  // NODES/EDGES 已在前面按白名单过滤，这里不再重复

  /* ---------- 力导向仿真 ---------- */
  const sim = {
    centerForce: 0.005,    // 中心引力稍降，让外围大点能散开
    repulsion: 3500,        // 排斥力更强（1400→3000→3500），配合节点放大保持秩序
    linkDistance: 85,       // 弹簧自然长度 70→85，节点更大需要更大间距
    linkStiffness: 0.04,
    damping: 0.86,
    maxV: 10,
    hubRepulsionBoost: 2.5, // hub 节点额外排斥倍数
    alpha: 1,
    step() {
      // 中心引力
      for (const n of NODES) {
        const dx = -n.x, dy = -n.y;
        const d = Math.sqrt(dx*dx + dy*dy) + 0.01;
        const f = this.centerForce * Math.sqrt(d);
        n.vx += (dx/d) * f;
        n.vy += (dy/d) * f;
      }
      // 排斥力（带空间裁剪，hub 节点排斥力更大）
      for (let i = 0; i < NODES.length; i++) {
        const a = NODES[i];
        if (a.pinned) continue;
        const aBoost = (a.kind === 'hub') ? this.hubRepulsionBoost : 1.0;
        for (let j = i+1; j < NODES.length; j++) {
          const b = NODES[j];
          if (b.pinned) continue;
          const dx = b.x - a.x, dy = b.y - a.y;
          const d2 = dx*dx + dy*dy + 0.01;
          if (d2 > 40000) continue;
          const d = Math.sqrt(d2);
          // 基础排斥力 × 两端 boost（hub 之间还会更强）
          const bBoost = (b.kind === 'hub') ? this.hubRepulsionBoost : 1.0;
          const f = this.repulsion * aBoost * bBoost / d2;
          const fx = (dx/d) * f, fy = (dy/d) * f;
          a.vx -= fx; a.vy -= fy;
          b.vx += fx; b.vy += fy;
        }
      }
      // 弹簧（hub 之间也拉长）
      for (const e of EDGES) {
        const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y;
        const d = Math.sqrt(dx*dx + dy*dy) + 0.01;
        // hub 之间的弹簧更长
        const linkLen = (e.a.kind === 'hub' && e.b.kind === 'hub')
                        ? this.linkDistance * 1.5
                        : this.linkDistance;
        const diff = d - linkLen;
        const f = diff * this.linkStiffness;
        const fx = (dx/d) * f, fy = (dy/d) * f;
        e.a.vx += fx; e.a.vy += fy;
        e.b.vx -= fx; e.b.vy -= fy;
      }
      // 应用
      for (const n of NODES) {
        if (n.pinned) { n.vx = 0; n.vy = 0; continue; }
        n.vx *= this.damping; n.vy *= this.damping;
        const v = Math.sqrt(n.vx*n.vx + n.vy*n.vy);
        if (v > this.maxV) { n.vx = n.vx/v*this.maxV; n.vy = n.vy/v*this.maxV; }
        n.x += n.vx; n.y += n.vy;
      }
      this.alpha *= 0.999;
    },
  };

  /* ---------- 渲染 ---------- */
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let W, H, dpr;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  }
  resize();
  window.addEventListener('resize', resize);

  const view = { x: 0, y: 0, k: 1, rot: 0, target: { x: 0, y: 0, k: 1 } };
  // 轨道漂移：缓慢自转（用户交互时停掉，3 秒后恢复）
  let drift = 0;           // 当前累计旋转角（弧度）
  let driftSpeed = 0.00006; // 弧度/帧 ≈ 0.0034°/帧 ≈ 0.2°/秒（更慢更稳）
  let driftPaused = false;
  let driftResumeAt = 0;   // 时间戳，到点恢复
  function applyView() {
    view.x += (view.target.x - view.x) * 0.15;
    view.y += (view.target.y - view.y) * 0.15;
    view.k += (view.target.k - view.k) * 0.15;
    // 计算漂移角度
    const now = performance.now();
    if (driftPaused && now > driftResumeAt) driftPaused = false;
    if (!driftPaused) drift += driftSpeed;
    view.rot = drift;
    // 变换 = T(cx,cy) * R(rot) * S(k*dpr) * T(view.x*dpr, view.y*dpr)
    // 先把世界 (x,y) 平移到 (x+tx, y+ty)，再缩放 k，再绕原点旋转 rot，最后平移到屏幕中心
    const k = view.k * dpr;
    const cos = Math.cos(view.rot), sin = Math.sin(view.rot);
    const cx = W * 0.5 * dpr, cy = H * 0.5 * dpr;
    const tx = view.x * dpr, ty = view.y * dpr;
    // 矩阵 [a c e; b d f; 0 0 1]
    ctx.setTransform(
      k * cos,  k * sin,        // a, b
      -k * sin, k * cos,        // c, d
      cx + tx * k * cos - ty * k * sin,    // e
      cy + tx * k * sin + ty * k * cos     // f
    );
  }
  function pauseDrift() {
    driftPaused = true;
    driftResumeAt = performance.now() + 3000;  // 3 秒后恢复
  }
  function screenToWorld(sx, sy) {
    // 屏幕 (CSS px) → dpr 化设备像素 → 减 cx,cy → 逆旋转 R(-rot) → 除 k → 减 tx,ty → 世界坐标
    // R(-rot) 矩阵: [cos, sin; -sin, cos]
    const k = view.k * dpr;
    const cos = Math.cos(view.rot), sin = Math.sin(view.rot);
    const cx = W * 0.5 * dpr, cy = H * 0.5 * dpr;
    const tx = view.x * dpr, ty = view.y * dpr;
    // 把 sx,sy 转 dpr
    const dx = sx * dpr - cx;
    const dy = sy * dpr - cy;
    // 逆旋转 R(-rot) = [cos, sin; -sin, cos]
    const ux = dx * cos + dy * sin;
    const uy = -dx * sin + dy * cos;
    // 除 k
    const vx = ux / k;
    const vy = uy / k;
    // 减 (tx, ty)
    return [vx - tx, vy - ty];
  }

  // 高亮状态
  let focused = null;     // 点击聚焦的节点
  let focusedSet = null;  // focused + 一阶邻居，Set<node>；null 表示无聚焦

  function drawEdge(e) {
    const a = e.a, b = e.b;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const offX = -my * 0.06, offY = mx * 0.06;
    // 高亮模式：只有相关边/节点用高亮色，其他灰暗
    const dim = focusedSet && !focusedSet.has(a) && !focusedSet.has(b);
    // 边粗细：随两端节点大小动态算（小节点连细线，hub-hub 稍粗）
    const aSz = a.size, bSz = b.size;
    const baseWidth = Math.max(0.7, (aSz + bSz) * 0.20);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.quadraticCurveTo(mx + offX, my + offY, b.x, b.y);
    if (dim) {
      ctx.strokeStyle = 'rgba(80, 85, 95, 0.18)';
      ctx.lineWidth = baseWidth * 0.7;
    } else {
      ctx.strokeStyle = 'rgba(190, 200, 230, 0.32)';
      ctx.lineWidth = baseWidth;
    }
    ctx.stroke();
  }
  function drawGlow(n) {
    const c = COLORS[n.color] || COLORS.pink;
    const dim = focusedSet && !focusedSet.has(n);
    const pulse = 0.85 + Math.sin(n.pulse + performance.now() * 0.0012) * 0.15;
    // 光晕半径收一些，避免吞噬核心光点
    const radius = n.size * (dim ? 1.8 : 2.2) * pulse;
    const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, radius);
    if (dim) {
      grad.addColorStop(0, c.glow + '30');
      grad.addColorStop(0.4, c.glow + '10');
      grad.addColorStop(1, c.glow + '00');
    } else {
      grad.addColorStop(0, c.glow + 'AA');
      grad.addColorStop(0.4, c.glow + '33');
      grad.addColorStop(1, c.glow + '00');
    }
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(n.x, n.y, radius, 0, Math.PI*2);
    ctx.fill();
  }
  function drawCore(n) {
    const c = COLORS[n.color] || COLORS.pink;
    const dim = focusedSet && !focusedSet.has(n);
    // 光点核心：按节点大小自适应（hub 大、普通节点小）
    // 用稍大一点的半径 + 白色描边，让光点从光晕中"凸显"
    const r = n.size * 1.0;  // 核心半径 = 节点 size
    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, Math.PI*2);
    // dim 时灰暗（不再用实心灰，用更暗的色让它融入背景）
    ctx.fillStyle = dim ? 'rgba(110, 115, 130, 0.4)' : c.core;
    ctx.fill();
    // 给光点加一圈描边（深色），让实心感和外圈光晕有明显分界
    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, Math.PI*2);
    ctx.strokeStyle = dim ? 'rgba(0,0,0,0.4)' : 'rgba(255,255,255,0.25)';
    ctx.lineWidth = Math.max(0.3, n.size * 0.12);
    ctx.stroke();
    // hub 节点额外加高光（仅非 dim）
    if (n.kind === 'hub' && !dim) {
      ctx.beginPath();
      ctx.arc(n.x - n.size*0.35, n.y - n.size*0.35, n.size*0.35, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fill();
    }
  }

  let hovered = null;

  function pickAt(sx, sy) {
    const [wx, wy] = screenToWorld(sx, sy);
    let best = null, bestD = 14 / view.k;  // 容差随缩放调整
    for (const n of NODES) {
      const dx = n.x - wx, dy = n.y - wy;
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d < bestD) { best = n; bestD = d; }
    }
    return best;
  }

  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#0d0d10';
    ctx.fillRect(0, 0, W*dpr, H*dpr);
    applyView();

    // 光晕
    ctx.globalCompositeOperation = 'lighter';
    for (const n of NODES) drawGlow(n);

    // 边
    ctx.globalCompositeOperation = 'source-over';
    for (const e of EDGES) drawEdge(e);

    // 实心
    ctx.globalCompositeOperation = 'lighter';
    for (const n of NODES) drawCore(n);

    // hover 高亮
    if (hovered) {
      ctx.globalCompositeOperation = 'source-over';
      ctx.beginPath();
      ctx.arc(hovered.x, hovered.y, hovered.size + 4, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }
    if (focused) {
      ctx.beginPath();
      ctx.arc(focused.x, focused.y, focused.size + 12, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      // 圈圈
      ctx.beginPath();
      ctx.arc(focused.x, focused.y, focused.size + 22, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.lineWidth = 0.6;
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function loop() {
    sim.step();
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ---------- 交互 ---------- */
  const stage = document.getElementById('stage');
  const tooltip = document.getElementById('tooltip');
  const focusLabel = document.getElementById('focus-label');

  // 预构建邻接表（用于点击高亮关联项）
  const adj = new Map();  // node -> Set<neighbor node>
  for (const e of EDGES) {
    if (!adj.has(e.a)) adj.set(e.a, new Set());
    if (!adj.has(e.b)) adj.set(e.b, new Set());
    adj.get(e.a).add(e.b);
    adj.get(e.b).add(e.a);
  }

  // 拖拽状态机
  let mode = 'idle';          // 'idle' | 'panning' | 'draggingNode'
  let dragNode = null;        // 当前拖拽的节点
  let dragStart = {x: 0, y: 0};
  let viewStart = {x: 0, y: 0};
  let nodeStart = {x: 0, y: 0};

  stage.addEventListener('mousedown', (e) => {
    pauseDrift();
    dragStart = {x: e.clientX, y: e.clientY};
    const n = pickAt(e.clientX, e.clientY);
    if (n) {
      // 拖拽节点
      mode = 'draggingNode';
      dragNode = n;
      nodeStart = {x: n.x, y: n.y};
      n.pinned = true;       // 暂停该节点的力导向
      stage.classList.add('dragging');
    } else {
      // 平移视图
      mode = 'panning';
      viewStart = {x: view.target.x, y: view.target.y};
      stage.classList.add('dragging');
    }
  });
  window.addEventListener('mouseup', (e) => {
    if (mode === 'draggingNode') {
      // 释放节点 → 重新参与力导向（保留当前位置，仅清零速度）
      if (dragNode) {
        dragNode.pinned = false;
        dragNode.vx = 0;
        dragNode.vy = 0;
      }
      // 拖拽距离很小才算 click
      const moved = Math.hypot(e.clientX - dragStart.x, e.clientY - dragStart.y);
      if (moved < 4 && dragNode) {
        // 触发聚焦高亮
        focused = dragNode;
        const set = new Set([dragNode]);
        const nbrs = adj.get(dragNode);
        if (nbrs) for (const nb of nbrs) set.add(nb);
        focusedSet = set;
        focusLabel.style.display = 'block';
        focusLabel.querySelector('.fl-name').textContent = dragNode.name;
        focusLabel.querySelector('.fl-meta').textContent =
          `${dragNode.path} · ${dragNode.degree} 个连接 · ${nbrs ? nbrs.size : 0} 个邻居已高亮`;
        focusLabel.style.left = (W/2 - 200) + 'px';
        focusLabel.style.top  = '20px';
      }
    } else if (mode === 'panning') {
      // 平移距离很小 → 视为点击空白处
      const moved = Math.hypot(e.clientX - dragStart.x, e.clientY - dragStart.y);
      if (moved < 4) {
        focused = null;
        focusedSet = null;
        focusLabel.style.display = 'none';
      }
    }
    mode = 'idle';
    dragNode = null;
    stage.classList.remove('dragging');
  });
  window.addEventListener('mousemove', (e) => {
    if (mode === 'panning') {
      view.target.x = viewStart.x + (e.clientX - dragStart.x);
      view.target.y = viewStart.y + (e.clientY - dragStart.y);
    } else if (mode === 'draggingNode' && dragNode) {
      // 节点世界坐标：mouse 当前世界 - 起始鼠标世界 + 起始节点世界
      const [wxNow, wyNow] = screenToWorld(e.clientX, e.clientY);
      const [wxStart, wyStart] = screenToWorld(dragStart.x, dragStart.y);
      dragNode.x = nodeStart.x + (wxNow - wxStart);
      dragNode.y = nodeStart.y + (wyNow - wyStart);
      dragNode.vx = 0;
      dragNode.vy = 0;
    }
  });

  stage.addEventListener('mousemove', (e) => {
    if (mode !== 'idle') return;
    const n = pickAt(e.clientX, e.clientY);
    if (n) {
      hovered = n;
      tooltip.style.display = 'block';
      tooltip.querySelector('.t-name').textContent = n.name;
      tooltip.querySelector('.t-meta').textContent =
        `连接 ${n.degree} · ${n.dir} · ${n.kind === 'hub' ? '枢纽' : n.kind === 'mid' ? '中等' : '叶节点'}`;
      tooltip.querySelector('.t-path').textContent = n.path;
      // 防止 tooltip 超出右/下边界
      const tw = 360, th = 80;
      let tx = e.clientX + 14, ty = e.clientY + 14;
      if (tx + tw > W) tx = e.clientX - tw - 14;
      if (ty + th > H) ty = e.clientY - th - 14;
      tooltip.style.left = tx + 'px';
      tooltip.style.top = ty + 'px';
      stage.style.cursor = 'grab';
    } else {
      hovered = null;
      tooltip.style.display = 'none';
      stage.style.cursor = 'grab';
    }
  });
  stage.addEventListener('mouseleave', () => {
    hovered = null;
    tooltip.style.display = 'none';
  });

  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    pauseDrift();
    const delta = -e.deltaY * 0.0015;
    const newK = Math.max(0.2, Math.min(4, view.target.k * (1 + delta)));
    const wx = (e.clientX - view.target.x) / view.target.k;
    const wy = (e.clientY - view.target.y) / view.target.k;
    view.target.k = newK;
    view.target.x = e.clientX - wx * newK;
    view.target.y = e.clientY - wy * newK;
  }, { passive: false });

  // 双击节点 → 打开 vault 里的真实文件
  stage.addEventListener('dblclick', (e) => {
    const n = pickAt(e.clientX, e.clientY);
    if (!n || !n.id) return;
    pauseDrift();
    // n.id 形如 "F:\\市场研发中心\\00 中心\\xxx.md"
    // 转成 file:/// URL 即可在浏览器新标签打开（QQ 浏览器会提示选择默认应用）
    let fileUrl = n.id.replace(/\\/g, '/');
    if (!fileUrl.startsWith('/')) fileUrl = '/' + fileUrl;  // Windows 盘符需要 /
    fileUrl = 'file:///' + fileUrl;
    window.open(fileUrl, '_blank');
  });

  document.getElementById('btnReset').addEventListener('click', () => {
    view.target = { x: W/2, y: H/2, k: 0.7 };
    focused = null;
    focusedSet = null;
    focusLabel.style.display = 'none';
    drift = 0;  // 重置旋转角度
  });
  document.getElementById('btnHelp').addEventListener('click', () => {
    alert(
      '👆 悬停节点 → 显示文件名 + 目录 + 连接数\n' +
      '👆 点击节点 → 聚焦 + 顶部显示该节点详情\n' +
      '👆👆 双击节点 → 打开 vault 里的真实文件\n' +
      '🖱 滚轮缩放（以鼠标为锚点）\n' +
      '✋ 拖拽节点/空白 平移视图\n' +
      '点击空白 → 取消聚焦\n' +
      '\n' +
      `📊 当前数据：${NODES.length} 笔记 / ${EDGES.length} 条 wikilink 边`
    );
  });
  document.getElementById('btnZoomIn').addEventListener('click', () => {
    view.target.k = Math.min(4, view.target.k * 1.3);
  });
  document.getElementById('btnZoomOut').addEventListener('click', () => {
    view.target.k = Math.max(0.2, view.target.k / 1.3);
  });

  // 初始视图
  view.target = { x: W/2, y: H/2, k: 0.7 };

  // 暴露数据用于调试
  window.__galaxy = { NODES, EDGES, sim, view };
  } catch (e) {
    const el = document.getElementById('loading');
    if (el) {
      el.style.display = 'flex';
      el.style.color = '#ff6b6b';
      el.style.fontSize = '11px';
      el.style.maxWidth = '80%';
      el.style.textAlign = 'left';
      el.style.whiteSpace = 'pre-wrap';
      el.textContent = '❌ 运行错误: ' + e.message + '\n\n' + (e.stack || '').slice(0, 800);
    }
    console.error(e);
  }
})();
</script>
</body>
</html>
